<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Deepshikha 🎂</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #ffd6e8, #ffeaf2);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
  }
  .cake {
    position: relative;
    width: 200px;
    height: 130px;
    background: #d2a679;
    border-radius: 0 0 20px 20px;
    box-shadow: inset 0 -15px 0 #c1965c, 0 4px 15px rgba(0,0,0,0.2);
  }
  .icing {
    position: absolute;
    top: 0;
    width: 100%;
    height: 30px;
    background: #ffebcc;
    border-radius: 20px 20px 0 0;
  }
  .cake::after {
    content: 'Deepshikha';
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #fff;
    font-weight: bold;
    font-size: 20px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
  }
  .candle {
    position: absolute;
    width: 10px;
    height: 40px;
    background: #ffd700;
    border-radius: 5px;
    top: -40px;
  }
  .flame {
    position: absolute;
    top: -15px;
    left: 50%;
    width: 10px;
    height: 15px;
    background: radial-gradient(circle at 50% 50%, #ffcc33, #ff6600);
    border-radius: 50%;
    transform: translateX(-50%);
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.1); opacity: 0.8; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }
  .hidden { display: none; }.message { opacity: 0; font-size: 26px; color: #ff69b4; font-weight: bold; text-shadow: 0 0 10px rgba(255,105,180,0.6); animation: bounceIn 2s forwards; animation-delay: 0.5s; } @keyframes bounceIn { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } } .balloon, .heart { position: absolute; opacity: 0.8; animation: floatUp 6s ease-in infinite; } .balloon { width: 20px; height: 30px; border-radius: 50%; background: gold; } .heart { width: 20px; height: 20px; background: pink; transform: rotate(45deg); } .heart::before, .heart::after { content: ''; position: absolute; width: 20px; height: 20px; background: pink; border-radius: 50%; } .heart::before { top: -10px; left: 0; } .heart::after { left: -10px; top: 0; } @keyframes floatUp { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(-400px) scale(1.2); opacity: 0; } } </style>

</head>
<body>
  <audio id="bgMusic" src="https://cdn.pixabay.com/download/audio/2023/04/02/audio_7f6c4a1ff8.mp3?filename=melody-143379.mp3" autoplay loop></audio>
  <audio id="clapSound" src="https://cdn.pixabay.com/download/audio/2021/08/09/audio_d5d0b5a989.mp3?filename=small-crowd-applause-6693.mp3"></audio>  <div class="cake">
    <div class="icing"></div>
    <div class="candle" style="left: 25px"><div class="flame"></div></div>
    <div class="candle" style="left: 65px"><div class="flame"></div></div>
    <div class="candle" style="left: 105px"><div class="flame"></div></div>
    <div class="candle" style="left: 145px"><div class="flame"></div></div>
  </div>  <div class="message hidden">Happy Birthday, My Sunshine ☀️💕</div>  <script>
    const candles = document.querySelectorAll('.flame');
    const message = document.querySelector('.message');
    const clap = document.getElementById('clapSound');

    // Mic setup to detect blow
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const mic = audioContext.createMediaStreamSource(stream);
      const analyser = audioContext.createAnalyser();
      mic.connect(analyser);
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function detectBlow() {
        analyser.getByteFrequencyData(dataArray);
        const volume = dataArray.reduce((a,b) => a+b) / dataArray.length;
        if (volume > 100) {
          blowOut();
        }
        requestAnimationFrame(detectBlow);
      }
      detectBlow();
    });

    function blowOut() {
      candles.forEach(f => {
        f.classList.add('hidden');
        const smoke = document.createElement('div');
        smoke.style.position = 'absolute';
        smoke.style.top = '-20px';
        smoke.style.left = '50%';
        smoke.style.width = '15px';
        smoke.style.height = '25px';
        smoke.style.borderRadius = '50%';
        smoke.style.background = 'rgba(200,200,200,0.5)';
        smoke.style.transform = 'translateX(-50%)';
        smoke.style.animation = 'smoke 2s forwards';
        f.parentElement.appendChild(smoke);
      });
      clap.play();
      spawnHeartsAndBalloons();
      message.classList.remove('hidden');
    }

    function spawnHeartsAndBalloons() {
      for (let i = 0; i < 10; i++) {
        const el = document.createElement(Math.random() > 0.5 ? 'div' : 'div');
        el.className = Math.random() > 0.5 ? 'balloon' : 'heart';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.bottom = '0';
        el.style.animationDuration = 4 + Math.random() * 3 + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 7000);
      }
    }

    window.addEventListener('beforeunload', () => {
      document.getElementById('bgMusic').pause();
    });

    const style = document.createElement('style');
    style.textContent = `@keyframes smoke { from { opacity:1; transform:translateY(0) scale(1);} to { opacity:0; transform:translateY(-40px) scale(1.5);} }`;
    document.head.appendChild(style);
  </script></body>
</html>
